[project]
name = "studio-agent"
version = "0.1.0"
description = "The Agent that answers Lineage Studio's chat: reads store, says only what it read"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.38",
    "httpx>=0.28",
    "langchain>=1.5,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "BLE", "UP"]
