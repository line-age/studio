# Lineage Studio in a container. From this directory:
#
#   docker compose --env-file frontend/.env.local up --build
#
# then open http://localhost:8080. Without the env file the app still runs and
# the map area says the Mapbox token is missing.

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_FIXTURE_URL: ${VITE_FIXTURE_URL:-}
    image: lineage-studio-frontend
    ports:
      # This machine only. Studio's proxy hands requests to store with a token, so do
      # not open it to a network; set STUDIO_BIND=0.0.0.0 only on one you trust.
      - "${STUDIO_BIND:-127.0.0.1}:${STUDIO_PORT:-8080}:8080"
    # To read your own fixture (see frontend/docs/fixtures.md), uncomment this
    # and set VITE_FIXTURE_URL=/fixtures/local/<file>.json in the env file.
    # volumes:
    #   - ./frontend/public/fixtures/local:/usr/share/nginx/html/fixtures/local:ro
    restart: unless-stopped
