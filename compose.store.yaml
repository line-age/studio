# Lineage Studio on real data from a local store, as Local developer. Start store
# with the fake GitHub first (tools/gas-stack.sh does both; see
# dev/fake-github/compose.yaml), then from this directory:
#
#   docker compose -f compose.yaml -f compose.store.yaml \
#     --env-file frontend/.env.local up --build
#
# nginx sends store the fixed token local-dev, which a store on the fake GitHub
# takes as Local developer and a real one refuses. It is given to nginx when the
# container starts, not built into the image or what the browser downloads.
# The image is tagged :local so it is never taken for one to deploy.

services:
  frontend:
    build:
      args:
        VITE_DATA_SOURCE: store
        # On one machine, with no gate: Local developer, by the token below.
        VITE_AUTH: local
    image: lineage-studio-frontend:local
    environment:
      STORE_URL: ${STORE_URL:-http://api:8000}
      STORE_TOKEN: local-dev
    networks: [default, store]

networks:
  # Compose names store's network after its folder.
  store:
    name: store_default
    external: true
